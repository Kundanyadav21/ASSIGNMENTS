
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="dashboard">

        <header class="header">
            <h2>My Dashboard</h2>
        </header>

        <aside class="sidebar">
            <h3>Menu</h3>
            <ul>
                <li>Home</li>
                <li>Profile</li>
                <li>Settings</li>
                <li>Logout</li>
            </ul>
        </aside>

        <main class="main">
            <h2>Dashboard Overview</h2>

            <div class="cards">

                <div class="card">
                    <span>👤</span>
                    <p>Total Users</p>
                </div>

                <div class="card">
                    <span>📊</span>
                    <p>Analytics</p>
                </div>

                <div class="card">
                    <span>💰</span>
                    <p>Revenue</p>
                </div>

                <div class="card">
                    <span>📩</span>
                    <p>Messages</p>
                </div>

                <div class="card">
                    <span>⚙️</span>
                    <p>Settings</p>
                </div>

                <div class="card">
                    <span>📅</span>
                    <p>Events</p>
                </div>

            </div>
        </main>

        <footer class="footer">
            <p>© 2026 My Dashboard. All Rights Reserved.</p>
        </footer>

    </div>

</body>
</html>
