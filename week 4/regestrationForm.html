<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
<form>
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" required>
    <br><br>

    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
    <br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required>
    <br><br>

    <label for="date">Date of Birth:</label>
    <input type="date" id="date" name="date">
    <br><br>

    <label for="phone">Phone Number:</label>
    <input type="tel" id="phone" name="phone">
    <br><br>

    <p>Choose your year:</p>
    <input type="radio" id="first" name="year" value="First Year">
    <label for="first">First Year</label>

    <input type="radio" id="second" name="year" value="Second Year">
    <label for="second">Second Year</label>
    <br><br>

    <p>Choose your interests:</p>
    <input type="checkbox" id="coding" name="interests" value="Coding">
    <label for="coding">Coding</label>

    <input type="checkbox" id="robotics" name="interests" value="Robotics">
    <label for="robotics">Robotics</label>

    <input type="checkbox" id="ai" name="interests" value="AI">
    <label for="ai">Artificial Intelligence</label>
    <br><br>

    <label for="event">Select an event:</label>
    <select id="event" name="event">
        <option value="">-- Choose an event --</option>
        <option value="Hackathon">Hackathon</option>
        <option value="Web Workshop">Web Workshop</option>
        <option value="Coding Contest">Coding Contest</option>
    </select>
    <br><br>

    <label for="message">Why do you want to join?</label>
    <br>
    <textarea id="message" name="message" rows="4" cols="35"></textarea>
    <br><br>

    <button type="submit">Register</button>
</form>

</body>
</html>
