
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            color: blueviolet;
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            padding: 20px;
        }

        .card {
            width: 300px;
            background-color: white;
            padding: 20px;
            border: 3px solid rgb(255, 0, 174);
            margin: 30px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>My Profile</h2>
        <p>Hello! I am a B.Tech student learning web development.</p>
    </div>

</body>
</html>
